{% extends "layout/baseCustomer.html" %}

{% block itemHeader %}
<div
    class="hidden md:flex items-center bg-surface-container-high rounded-full px-4 py-2 gap-2 border border-outline-variant w-72 lg:w-80 transition-all duration-200">
    <span id="header-search-icon" class="material-symbols-outlined text-secondary text-[18px]">search</span>
    <input id="header-search-input" type="text" placeholder="Tìm món ăn, nhà hàng..."
    class="bg-transparent border-none outline-none focus:outline-none focus:ring-0 focus:shadow-none focus-visible:outline-none appearance-none text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant w-full"
    style="outline: none; box-shadow: none;" />
</div>

{% endblock %}

{% block content %}
<div id="hero-section"></div>

<!-- Section 'Gợi ý cho bạn' -->
<section id="suggestions-section" class="space-y-sm scroll-mt-24">

    <div class="flex justify-between items-end">
        <h2 class="font-headline-lg text-headline-lg text-on-surface">Gợi ý AI cho bạn</h2>
        <div class="flex gap-2">

            <button id="suggestion-scroll-left"
                class="scroll-btn p-2 rounded-full border border-outline-variant hover:bg-primary-container hover:text-on-primary-container hover:border-primary hover:scale-110 active:scale-90 transition-all duration-200"><span
                    class="material-symbols-outlined">chevron_left</span></button>
            <button id="suggestion-scroll-right"
                class="scroll-btn p-2 rounded-full border border-outline-variant hover:bg-primary-container hover:text-on-primary-container hover:border-primary hover:scale-110 active:scale-90 transition-all duration-200"><span
                    class="material-symbols-outlined">chevron_right</span></button>
        </div>
    </div>
    <div id="suggestions"
        class="flex overflow-x-auto gap-gutter pb-4 no-scrollbar snap-x snap-mandatory scroll-smooth">
    </div>
</section>
<!-- Section 'Nhà hàng nổi bật' -->
<section class="space-y-sm">
    <div class="flex justify-between items-end">
        <h2 class="font-headline-lg text-headline-lg text-on-surface">Nhà hàng nổi bật</h2>
        <div class="flex gap-2">
            <button id="scroll-left"
                class="scroll-btn p-2 rounded-full border border-outline-variant hover:bg-primary-container hover:text-on-primary-container hover:border-primary hover:scale-110 active:scale-90 transition-all duration-200"><span
                    class="material-symbols-outlined">chevron_left</span></button>
            <button id="scroll-right"
                class="scroll-btn p-2 rounded-full border border-outline-variant hover:bg-primary-container hover:text-on-primary-container hover:border-primary hover:scale-110 active:scale-90 transition-all duration-200"><span
                    class="material-symbols-outlined">chevron_right</span></button>
        </div>
    </div>
    <div id="restaurant-scroll"
        class="flex overflow-x-auto gap-gutter pb-4 no-scrollbar snap-x snap-mandatory scroll-smooth">
    </div>

    <div class="flex justify-end">
        <a class="text-primary font-label-md text-label-md flex items-center gap-1 hover:underline" href="/search_customer?tab=restaurants">
            Xem thêm
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </a>
    </div>
</section>
<script src="{{ url_for('static', filename='js/homepage.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', async function () {
        renderHeroSection(getTimePeriod());

        try {
            await loadingState.run(async () => {
                const [restaurants, topRecommendations] = await Promise.all([
                    loadRestaurants(),
                    loadTopRecommendations(),
                    loadRestaurantCardTemplate()
                ]);

                renderSuggestions('suggestions', topRecommendations);
                await renderRestaurantList('restaurant-scroll', restaurants, 'carousel');
            });
        } catch (error) {
            console.error('Không thể tải dữ liệu trang chủ:', error);
            showToast('Không thể tải danh sách nhà hàng', 'error');
        }

        const btnSuggLeft = document.getElementById('suggestion-scroll-left');
        const btnSuggRight = document.getElementById('suggestion-scroll-right');
        const suggContainer = document.getElementById('suggestions');

        if (suggContainer && btnSuggLeft && btnSuggRight) {
            btnSuggLeft.addEventListener('click', function () {
                suggContainer.scrollBy({ left: -320, behavior: 'smooth' });
            });
            btnSuggRight.addEventListener('click', function () {
                suggContainer.scrollBy({ left: 320, behavior: 'smooth' });
            });
        }

        const btnLeft = document.getElementById('scroll-left');
        const btnRight = document.getElementById('scroll-right');
        const container = document.getElementById('restaurant-scroll');

        if (container) {
            btnLeft.addEventListener('click', function () {
                container.scrollBy({ left: -400, behavior: 'smooth' });
            });
            btnRight.addEventListener('click', function () {
                container.scrollBy({ left: 400, behavior: 'smooth' });
            });
        }
    });
</script>

{% endblock %}
